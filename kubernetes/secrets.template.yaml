# Secret com credenciais e chaves sensíveis.
# ESTE ARQUIVO É UM TEMPLATE. NÃO tenha valores reais aqui.
# O script kubernetes/apply.sh gera o secrets.yaml real (gitignored)
# substituindo {{...}} pelos valores do terraform output (base64).
#
# Nunca commite o secrets.yaml gerado!

apiVersion: v1
kind: Secret
metadata:
  name: togglemaster-secrets
  namespace: apps
type: Opaque
data:
  # Senhas dos 3 RDS (outputs terraform, sensitive)
  AUTH_RDS_PASSWORD: "{{AUTH_RDS_PASSWORD_B64}}"
  FLAGS_RDS_PASSWORD: "{{FLAGS_RDS_PASSWORD_B64}}"
  TARGETING_RDS_PASSWORD: "{{TARGETING_RDS_PASSWORD_B64}}"

  # Chaves de aplicação
  MASTER_KEY: "{{MASTER_KEY_B64}}"
  SERVICE_API_KEY: "{{SERVICE_API_KEY_B64}}"
