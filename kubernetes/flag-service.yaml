apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: apps
  labels:
    app: flag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: "{{FLAG_ECR_URL}}:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: FLAGS_RDS_USER
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: FLAGS_RDS_USER
            - name: FLAGS_RDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: FLAGS_RDS_PASSWORD
            - name: FLAGS_RDS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: FLAGS_RDS_ENDPOINT
            - name: FLAGS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: FLAGS_DB_NAME
            - name: DATABASE_URL
              value: "postgres://$(FLAGS_RDS_USER):$(FLAGS_RDS_PASSWORD)@$(FLAGS_RDS_ENDPOINT)/$(FLAGS_DB_NAME)"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AUTH_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP
