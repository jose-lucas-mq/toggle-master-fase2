# ServiceAccounts com IRSA (IAM Roles for Service Accounts)
# As anotações eks.amazonaws.com/role-arn são preenchidas pelo script
# kubernetes/apply.sh usando terraform output.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-sa
  namespace: apps
  annotations:
    eks.amazonaws.com/role-arn: "{{IRSA_EVALUATION_ROLE_ARN}}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-sa
  namespace: apps
  annotations:
    eks.amazonaws.com/role-arn: "{{IRSA_ANALYTICS_ROLE_ARN}}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-operator
  namespace: keda
  annotations:
    eks.amazonaws.com/role-arn: "{{IRSA_KEDA_ROLE_ARN}}"
